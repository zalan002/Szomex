<form class="sz-form" data-lead-form data-steps data-clarity-mask="true" data-kind="{{FORM_KIND}}" action="/api/lead" method="post" novalidate>
  <div class="step-head" aria-hidden="true"><span class="step-title"></span><span class="step-no"></span></div>
  <div class="step-bar" role="progressbar" aria-label="Kitöltés állapota" aria-valuemin="0" aria-valuemax="100"><span></span></div>
  <fieldset class="form-step" data-title="Bemutatkozás">
    <legend class="step-legend">1. Bemutatkozás</legend>
    <p class="step-desc">3 rövid lépés, kb. 1 perc. Hogyan szólíthatunk?</p>
    <label>Neved <span aria-hidden="true">*</span><input name="name" autocomplete="name" required minlength="2" maxlength="100" placeholder="Pl. Kovács Péter"></label>
  </fieldset>
  <fieldset class="form-step" data-title="Elérhetőség">
    <legend class="step-legend">2. Elérhetőség</legend>
    <p class="step-desc">Ezeken keresünk az ajánlattal.</p>
    <div class="form-grid">
      <label>E-mail-címed <span aria-hidden="true">*</span><input name="email" type="email" inputmode="email" autocomplete="email" required maxlength="254" placeholder="pelda@email.hu"></label>
      <label>Telefonszámod<input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="+36 30 123 4567"></label>
    </div>
    <label class="check"><input type="checkbox" name="privacy" value="yes" required><span>Elolvastam az <a href="/adatkezeles" target="_blank" rel="noopener">adatkezelési tájékoztatót</a>, és kérem, hogy az ajánlatkérésemmel kapcsolatban keressetek meg. <span aria-hidden="true">*</span></span></label>
  </fieldset>
  <fieldset class="form-step" data-title="A projekted">
    <legend class="step-legend">3. A projekted</legend>
    <p class="step-desc">Ha még nem tudsz pontos méreteket, azt is jelezheted.</p>
    <div class="form-grid">
      <label class="stairs-only">Hány lépcsőfokhoz keresel anyagot?<input name="steps" type="number" min="1" max="300" inputmode="numeric" placeholder="Pl. 16"></label>
      <label class="stairs-only">Mikor lenne szükséged rá?<select name="timeline"><option value="">Válassz időpontot</option><option>Amint lehetséges</option><option>1–3 hónapon belül</option><option>3 hónapnál később</option><option>Még tervezek</option></select></label>
      <label class="stairs-only full">Település<input name="city" autocomplete="address-level2" maxlength="100" placeholder="Hová kell az alapanyag?"></label>
      <label class="full">Miben segíthetünk? <span aria-hidden="true">*</span><textarea name="message" rows="4" required minlength="5" maxlength="5000" placeholder="Írd meg a méreteket, a mennyiséget és az elképzelésedet."></textarea></label>
    </div>
    <label class="check stairs-only"><input type="checkbox" name="materialOnly" value="yes"><span>Tudomásul veszem, hogy a SZOMEX Kft. az alapanyagot biztosítja; a felmérést és a beszerelést saját szakemberrel intézem.</span></label>
  </fieldset>
  <div class="hp" aria-hidden="true"><label>Weboldal<input name="website" tabindex="-1" autocomplete="off"></label></div>
  <div data-turnstile></div>
  <div class="step-nav">
    <button class="step-back" type="button" hidden>← Vissza</button>
    <button class="button step-next" type="button" hidden>Tovább <span aria-hidden="true">→</span></button>
    <button class="button form-submit" type="submit">Ajánlatot kérek <span aria-hidden="true">↗</span></button>
  </div>
  <p class="form-note">Az ajánlatkérés nem jár vásárlási kötelezettséggel.</p>
  <p class="form-status" role="status" aria-live="polite" tabindex="-1"></p>
  <noscript>Az online küldéshez engedélyezd a JavaScriptet, vagy írj a <a href="mailto:taborfalva@szomex.hu">taborfalva@szomex.hu</a> címre.</noscript>
</form>
